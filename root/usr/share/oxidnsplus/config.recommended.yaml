# ==============================================================================
# OxiDNS 推荐配置 · luci-app-oxidns-plus 参考模板（只读，不会被自动写入设备）
#
# 目标二进制：官方 1.7.1 full bundle（基础包当前打包版本）
# 可直接通过 `oxidns check -c ... -d /var/lib/oxidns` 校验。
#
# 用法：本文件只是参考。请在基础包 LuCI 的「Configuration」页里手动套用，
#       或在 OxiDNS Plus 页面点「Recommended config」查看后复制。
#       luci-app-oxidns-plus 不会自动改写 /etc/oxidns/config.yaml。
#
# 相对原 v5 配置的改动（全部为 L0 纯配置，不含官方二进制不认识的字段）：
#   [P1] cache_main.lazy_cache_ttl: 86400 -> 3600
#        不再返回隔夜旧 IP，仍保留 stale 后台刷新兜底。
#        OxiDNS Plus 页面「配置调优」按钮可带备份/校验/回滚自动完成这一处。
#        若将来启用 F1（serve_stale_client_timeout_ms），可再压到 600。
#   [P2] ECS 维持全剥离：edns_strip 不变，不引入 ecs_handler / client_ip_from_ecs，
#        ecs_in_key 保持 false。
#   [P3] 不含 guest 分支（已确认不要）；不含按请求方切缓存。
#   [S2] hosts_system.files 增加 /etc/oxidns/dhcp-hosts（由 Plus 包生成）。
#
# 预热（S1）不在本文件里：Plus 包用 OpenWrt 系统 crond + init.d 承担，
# 无需在 OxiDNS 内部配置 cron/script 插件，也就不需要改本文件。
#
# F1 字段以注释形式留在 cache_main 段；官方 1.7.1 不认识它，
# 见 docs/ROADMAP.md 第二阶段。
#
# 占位条目（沿用 v5 原样，未擅自删除；部署前请逐条确认去留）：
#   home.example.com / corp.example / ads.my-home.example / privacy_domains
#   里的成人域名 / 静态 IP 192.168.1.10 fd00::10
# ==============================================================================

# ------------------------------------------------------------------------------
# 一、全局配置
# ------------------------------------------------------------------------------

runtime:
  worker_threads: 4

log:
  level: info
  # 不配置 file = 只输出到 stdout，由 procd 收进 syslog 内存环形缓冲，闪存零写入。

api:
  http:
    listen: "192.168.1.1:9199"
    auth:
      type: basic
      # 必须带引号，否则 YAML 解析成整数，反序列化失败且不点名字段。
      username: "jiazilong"
      password: "${OXIDNS_API_PASS:-temp884426}"
    webui:
      root: "/usr/share/oxidns/webui"
      index: "index.html"

network:
  outbound:
    default: direct
    profiles:
      direct:
        resolver: system
        proxy: none
      # 本机已由代理层透明接管国外流量，以下 profile 保留但未被引用。
      proxy:
        resolver:
          nameservers:
            - addr: "223.5.5.5:53"
          ip_version: 4
          timeout: 3s
          proxy: none
        proxy:
          socks5: "127.0.0.1:7890"

# ------------------------------------------------------------------------------
# 二、插件
# ------------------------------------------------------------------------------
plugins:

  # ==========================================================================
  # 2.1 规则订阅下载
  # ==========================================================================
  - tag: rules_download
    type: download
    args:
      timeout: 60s
      startup_if_missing: true
      downloads:
        - url: "https://anti-ad.net/easylist.txt"
          dir: "/etc/oxidns/rules"
          filename: "adguard-antiad.txt"
        - url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt"
          dir: "/etc/oxidns/rules"
          filename: "adguard-hostlist.txt"

  - tag: reload_rule_providers
    type: reload_provider
    args:
      - "$geosite_cn"
      - "$geosite_ads"
      - "$privacy_geosite"
      - "$geoip_cn"
      - "$adguard_antiad"
      - "$adguard_hostlist"

  - tag: rules_refresh
    type: sequence
    args:
      - exec: "$rules_download"
      - exec: "$reload_rule_providers"

  # ==========================================================================
  # 2.2 Provider
  #   geo 数据源 /usr/share/v2ray/ 由 v2ray-geodata 包提供，必须是 protobuf dat，
  #   不要指向 sing-box 的 .srs。部署前确认：
  #     ls -l /usr/share/v2ray/geosite.dat /usr/share/v2ray/geoip.dat
  # ==========================================================================
  - tag: geosite_cn
    type: geosite
    args:
      file: "/usr/share/v2ray/geosite.dat"
      selectors: ["cn"]

  - tag: geosite_ads
    type: geosite
    args:
      file: "/usr/share/v2ray/geosite.dat"
      selectors: ["category-ads-all"]

  - tag: privacy_geosite
    type: geosite
    args:
      file: "/usr/share/v2ray/geosite.dat"
      selectors: ["category-porn", "mindgeek"]

  - tag: adguard_antiad
    type: adguard_rule
    args:
      files:
        - "/etc/oxidns/rules/adguard-antiad.txt"

  - tag: adguard_hostlist
    type: adguard_rule
    args:
      files:
        - "/etc/oxidns/rules/adguard-hostlist.txt"

  - tag: adguard_local
    type: adguard_rule
    args:
      rules:
        - "||ads.my-home.example^"
        - "||tracker.my-home.example^$dnstype=A|AAAA"
        - "@@||good.my-home.example^"
        - "||api.miwifi.com^"

  - tag: local_domains
    type: domain_set
    args:
      exps:
        - "domain:lan"
        - "domain:home.arpa"
        - "domain:corp.example"
        - "full:internal-app.corp.example"

  - tag: privacy_domains
    type: domain_set
    args:
      exps:
        - "domain:missav.ai"
        - "domain:jable.tv"
        - "domain:missav.ws"

  - tag: allowlist
    type: dynamic_domain_set
    args:
      path: "/etc/oxidns/rules/allowlist.txt"
      queue_size: 1024
      batch_size: 256
      flush_interval_ms: 200

  - tag: geoip_cn
    type: geoip
    args:
      file: "/usr/share/v2ray/geoip.dat"
      selectors: ["cn"]

  # ==========================================================================
  # 2.3 观测与查询日志
  #   一条查询恰好命中一个日志出口，一行/查询。隐私组不打日志。
  # ==========================================================================
  - tag: metrics_main
    type: metrics_collector
    args:
      name: "main"

  - tag: log_local
    type: query_summary
    args:
      msg: "本地应答"

  - tag: log_cache
    type: query_summary
    args:
      msg: "缓存命中"

  - tag: log_internal
    type: query_summary
    args:
      msg: "内网组"

  - tag: log_cn
    type: query_summary
    args:
      msg: "国内组"

  - tag: log_abroad
    type: query_summary
    args:
      msg: "国外组"

  - tag: log_blocked
    type: query_summary
    args:
      msg: "拦截"

  # ==========================================================================
  # 2.4 本地应答
  #   short_circuit: false —— 命中后由 has_resp 分流到日志出口再 accept。
  # ==========================================================================
  - tag: hosts_main
    type: hosts
    args:
      entries:
        - "full:router.lan 192.168.1.1"
        - "full:nas.lan 192.168.1.2"
      short_circuit: false

  # format: standard 直接吃标准 hosts 文件（IP 在前）。
  # format 同时作用于 entries 与 files，所以必须独立一个插件。
  - tag: hosts_system
    type: hosts
    args:
      format: standard
      files:
        - "/etc/hosts"
        # [S2] 由 luci-app-oxidns-plus 从 /tmp/dhcp.leases 生成；
        #      安装脚本会创建一个仅含注释的占位文件，保证启动时可读。
        - "/etc/oxidns/dhcp-hosts"
      short_circuit: false

  - tag: arbitrary_main
    type: arbitrary
    args:
      rules:
        - "$TTL 600"
        - "example.lan.        IN MX 10 mail.example.lan."
        - "mail.example.lan.   IN A 192.168.1.25"
        - "_sip._tcp.example.lan. 300 IN SRV 10 60 5060 sip.example.lan."
        - "example.lan.        IN TXT \"v=spf1 mx -all\""
      short_circuit: false

  - tag: reverse_lookup_main
    type: reverse_lookup
    args:
      size: 65535
      ttl: 7200
      handle_ptr: true

  # ==========================================================================
  # 2.5 缓存
  # ==========================================================================
  - tag: cache_main
    type: cache
    args:
      size: 16384
      short_circuit: false
      cache_negative: true
      max_negative_ttl: 600
      negative_ttl_without_soa: 60
      max_positive_ttl: 86400
      min_positive_ttl: 5
      # [P1] 86400 -> 3600：上游失败时不再返回隔夜旧 IP。
      #      stale 命中仍会在后台异步刷新（cache_lazy_refresh_total 可观测）。
      lazy_cache_ttl: 3600
      # [P2] ECS 不参与缓存键，避免碎片；ECS 已在 edns_strip 全剥离。
      ecs_in_key: false
      dump_file: "./data/cache.dump"
      dump_interval: 600
      # ------------------------------------------------------------------
      # [F1] 以下字段官方 1.7.1 不存在，当前二进制写入会导致配置校验失败。
      #      仅在启用自定义二进制（在 NetForgeCN 仓库内打补丁编译）后取消注释。
      #      建议值 1500：上游只是慢时先给 1.5s 机会拿新答案，真挂了才回 stale。
      #      必须 < 上游 timeout(3s/5s) 且 < request_timeout(8s)。
      #      启用后 lazy_cache_ttl 可进一步压到 600。
      # serve_stale_client_timeout_ms: 1500
      # ------------------------------------------------------------------

  # ==========================================================================
  # 2.6 EDNS
  #   [P2] ECS 全剥离。strip_unknown 删掉 IANA 未注册 Option（65001 等指纹向量），
  #        denylist: [8] 再单独删 ECS。restore_request 避免过滤结果泄漏到后续链。
  #   注意：edns_filter 的 next 覆盖当前 sequence 剩余规则，必须与 forward 同链。
  # ==========================================================================
  - tag: edns_strip
    type: edns_filter
    args:
      policy: strip_unknown
      denylist: [8]
      restore_request: true

  # ==========================================================================
  # 2.7 上游
  # ==========================================================================
  - tag: forward_cn
    type: forward
    args:
      concurrent: 2
      response_selection: balanced
      upstreams:
        - tag: "alidns_doh"
          addr: "https://dns.alidns.com/dns-query"
          bootstrap: "223.5.5.5:53"
          timeout: 3s
        - tag: "dnspod_doh"
          addr: "https://doh.pub/dns-query"
          bootstrap: "119.29.29.29:53"
          timeout: 3s
        - tag: "dnspod_udp"
          addr: "udp://119.29.29.29:53"
          timeout: 2s

  - tag: forward_abroad
    type: forward
    args:
      concurrent: 2
      response_selection: balanced
      upstreams:
        - tag: "cloudflare_doh"
          addr: "https://cloudflare-dns.com/dns-query"
          bootstrap: "1.1.1.1:53"
          timeout: 5s
        - tag: "google_dot"
          addr: "tls://dns.google:853"
          bootstrap: "8.8.8.8:53"
          timeout: 5s

  - tag: forward_privacy
    type: forward
    args:
      upstreams:
        - addr: "tls://dns.quad9.net:853"
          bootstrap: "9.9.9.9:53"
          timeout: 5s

  # dnsmasq 侧必须配置 local=/lan/ /home.arpa/ /corp.example/，
  # 否则 53 -> 5333 -> 53 会形成查询环。
  - tag: forward_internal
    type: forward
    args:
      upstreams:
        - addr: "udp://192.168.1.1:53"

  # ==========================================================================
  # 2.8 响应处理
  # ==========================================================================
  - tag: ttl_clamp
    type: ttl
    args:
      min: 10
      max: 3600

  # ==========================================================================
  # 2.9 后台调度
  #   cron.interval 最小 1m，且「启动后需等一个完整间隔才首次触发」。
  #   显式时区保证换时区/容器化后 schedule 不静默偏移 8 小时。
  # ==========================================================================
  - tag: maintenance_cron
    type: cron
    args:
      timezone: "Asia/Shanghai"
      jobs:
        - name: refresh_rule_subscriptions
          interval: 12h
          executors:
            - "$rules_refresh"
        # ----------------------------------------------------------------
        # [S1] 预热不在这里配置。
        #      luci-app-oxidns-plus 用 OpenWrt 系统 crond 承担：
        #        /etc/init.d/oxidnsplus 安装带标记的任务块（默认 */2 分钟），
        #        并在启动时立即后台跑一次，避开 cron 首个间隔的空窗。
        #      这样预热完全不需要 OxiDNS 内部的 cron/script 插件，
        #      也就不需要改这份主配置。频率在 Plus 的 UCI / LuCI 里改。
        # ----------------------------------------------------------------

  # ==========================================================================
  # 2.10 日志出口
  # ==========================================================================
  - tag: seq_log_local
    type: sequence
    args:
      - exec: "$log_local"
      - exec: accept

  - tag: seq_log_cache
    type: sequence
    args:
      - exec: "$log_cache"
      - exec: accept

  # ==========================================================================
  # 2.11 策略编排
  # ==========================================================================
  - tag: seq_blocked
    type: sequence
    args:
      - exec: "$log_blocked"
      - exec: "black_hole null short_circuit=true"
      - exec: accept

  - tag: seq_forward_internal
    type: sequence
    args:
      - exec: "$log_internal"
      - matches: "!has_resp"
        exec: "$forward_internal"

  - tag: seq_forward_privacy
    type: sequence
    args:
      - exec: "$edns_strip"
      - matches: "!has_resp"
        exec: "$forward_privacy"
      - matches: "has_resp"
        exec: "$ttl_clamp"

  - tag: seq_forward_cn
    type: sequence
    args:
      - exec: "$log_cn"
      - matches: "!has_resp"
        exec: "$forward_cn"

  - tag: seq_forward_abroad
    type: sequence
    args:
      - exec: "$log_abroad"
      - exec: "$edns_strip"
      - matches: "!has_resp"
        exec: "$forward_abroad"
      - matches:
          - "has_resp"
          - "resp_ip $geoip_cn"
        # jump 而非 goto：让 summary 的 continuation 正常收尾，日志只出一行。
        exec: "jump seq_abroad_to_cn"

  - tag: seq_abroad_to_cn
    type: sequence
    args:
      - exec: "drop_resp"
      - matches: "!has_resp"
        exec: "$forward_cn"
      - matches: "has_resp"
        exec: "$ttl_clamp"

  - tag: seq_resolve
    type: sequence
    args:
      - matches: "qname $privacy_domains"
        exec: goto seq_forward_privacy
      - matches: "qname $privacy_geosite"
        exec: goto seq_forward_privacy
      - exec: "$cache_main"
      - matches: "has_resp"
        exec: goto seq_log_cache
      - matches:
          - "!has_resp"
          - "qname $local_domains"
        exec: jump seq_forward_internal
      - matches:
          - "!has_resp"
          - "qname $geosite_cn"
        exec: jump seq_forward_cn
      - matches: "!has_resp"
        exec: jump seq_forward_abroad
      - matches: "has_resp"
        exec: "$ttl_clamp"

  - tag: seq_main
    type: sequence
    args:
      - exec: "$metrics_main"
      - exec: "$hosts_main"
      - exec: "$hosts_system"
      - exec: "$arbitrary_main"
      - exec: "$reverse_lookup_main"
      - matches: "has_resp"
        exec: goto seq_log_local
      - matches: "qname $allowlist"
        exec: jump seq_resolve
      - matches: "qname $privacy_domains"
        exec: jump seq_resolve
      - matches: "qname $privacy_geosite"
        exec: jump seq_resolve
      - matches:
          - "!has_resp"
          - "question $adguard_antiad"
        exec: goto seq_blocked
      - matches:
          - "!has_resp"
          - "question $adguard_hostlist"
        exec: goto seq_blocked
      - matches:
          - "!has_resp"
          - "question $adguard_local"
        exec: goto seq_blocked
      - matches:
          - "!has_resp"
          - "qname $geosite_ads"
        exec: goto seq_blocked
      - matches: "!has_resp"
        exec: jump seq_resolve
      - exec: accept

  # ==========================================================================
  # 2.12 入口：LAN IP + 回环，各一对 UDP/TCP
  #   listen 只接受单个地址，多地址必须多实例；不要用 ":5333"。
  # ==========================================================================
  - tag: udp_lan
    type: udp_server
    args:
      entry: "seq_main"
      listen: "192.168.1.1:5333"

  - tag: udp_lo
    type: udp_server
    args:
      entry: "seq_main"
      listen: "127.0.0.1:5333"

  - tag: tcp_lan
    type: tcp_server
    args:
      entry: "seq_main"
      listen: "192.168.1.1:5333"
      idle_timeout: 10

  - tag: tcp_lo
    type: tcp_server
    args:
      entry: "seq_main"
      listen: "127.0.0.1:5333"
      idle_timeout: 10

  # ==========================================================================
  # 2.13 加密入口（需要证书时取消注释）
  # ==========================================================================
  # - tag: dot_server
  #   type: tcp_server
  #   args:
  #     entry: "seq_main"
  #     listen: ":853"
  #     cert: "/etc/oxidns/certs/server.crt"
  #     key: "/etc/oxidns/certs/server.key"
  #     idle_timeout: 30
  #
  # - tag: doh_server
  #   type: http_server
  #   args:
  #     listen: ":443"
  #     cert: "/etc/oxidns/certs/server.crt"
  #     key: "/etc/oxidns/certs/server.key"
  #     enable_http3: true
  #     idle_timeout: 30
  #     entries:
  #       - path: "/dns-query"
  #         exec: "seq_main"
  #         json_api: true

# ==============================================================================
# 三、可选块
# ==============================================================================
#
# ---------- 可选块 A：[F1] 自定义二进制（第二阶段，本版未实现） ----------
# 官方 1.7.1 的 cache 插件没有 serve_stale_client_timeout_ms。
# 当前核心是预编译 musl 二进制，要落地该字段必须把 Rust 源码 vendor 进
# 自家仓库 + 交叉编译，见 luci-app-oxidns-plus/docs/ROADMAP.md。
# 补丁生效后：取消 cache_main 里该字段的注释，并把 lazy_cache_ttl 压到 600。
#
# ---------- 可选块 B：[S1] 预热 ----------
# 已由 luci-app-oxidns-plus 承担，无需在本文件里加任何插件：
#   /etc/init.d/oxidnsplus  -> 安装系统 crond 任务块（默认每 2 分钟）
#   /usr/libexec/oxidnsplus-warm.sh -> 向 127.0.0.1:5333 发真实查询
#   /etc/oxidns/warm.list   -> 可编辑清单（LuCI 页面里改）
# 启动时额外立即预热一次，解决 cron 首个间隔的空窗。
# 频率在 UCI oxidnsplus.main.warm_interval 或 LuCI 页面调整，最小 1 分钟。
#
# ---------- 可选块 C：[S2] DHCP 主机名 ----------
# 官方 OpenWrt 的 dnsmasq.init 硬编码 --dhcp-leasefile /tmp/dhcp.leases，
# 格式： <expiry_epoch> <MAC> <IP> <hostname> <client_id>，hostname 可能是 *。
# Plus 包生成 /etc/oxidns/dhcp-hosts（标准 hosts 格式），已在上面
# hosts_system.files 里挂好。
# 文件变化后由 /etc/init.d/oxidns reload（procd_send_signal）生效；
# reload 会等 cache.dump 恢复，但 dump 周期 600s，最近条目仍会丢，
# 所以 dhcp_auto_reload 默认关闭。
# 正向解析确定可用；PTR 依赖 reverse_lookup_main(handle_ptr: true)，
# 建议实测验证，不要假定一定生成。
#
# ==============================================================================
# 四、说明
#
# 1. 失败降级口径：国外组不回落国内 UDP，失败即 SERVFAIL（v5 既定设计）。
# 2. rcode=<none> 表示该分支上游全失败；elapsed_ms 为所属分支耗时。
# 3. geo 数据由 v2ray-geodata 包维护，包升级后需 reload_provider：
#    本配置 12h refresh_rule_subscriptions 已包含重载。
# 4. 闪存写入：日志 0、审计 0；规则下载几百 KB/12h，外加 cache.dump 每 600s。
#    要彻底归零可删 dump_file / dump_interval。
# 5. 预热清单里被广告规则拦截的域名已注释，见 warm.list 说明。
# ==============================================================================
